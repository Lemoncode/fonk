<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla / 01 Validate field</title>
  </head>
  <body>
    <main class="app">
      <h1>Fonk and Vanilla Typescript</h1>
      <h2>Validate single field</h2>
      <form id="form">
        <div>
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" placeholder="First Name" />
          <span data-testid="firstName-error" id="firstName-error"></span>
        </div>
        <div>
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" placeholder="Last Name" />
          <span data-testid="lastName-error" id="lastName-error"></span>
        </div>
        <div>
          <label for="age">Age</label>
          <input id="age" type="number" placeholder="Age" />
          <span data-testid="age-error" id="age-error"></span>
        </div>
        <div class="buttons">
          <button type="submit">Submit</button>
          <button id="reset-button" type="button">Reset</button>
        </div>
        <pre id="result"></pre>
        <pre id="errors"></pre>
      </form>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
